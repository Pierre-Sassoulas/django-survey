ci:
  skip: [pylint]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-json
      - id: check-ast
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: "v0.16.9"
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format
  - repo: https://github.com/djlint/djlint
    rev: "v1.44.2"
    hooks:
      - id: djlint-django
        args: ["--reformat"]
      - id: djlint-django
  - repo: https://github.com/Pierre-Sassoulas/django-no-multiline-template-comment
    rev: v0.0.2
    hooks:
      - id: django-no-multiline-template-comment
        args: ["--fix"]
  - repo: https://github.com/tox-dev/pyproject-fmt
    rev: "v2.29.4"
    hooks:
      - id: pyproject-fmt
  - repo: https://github.com/asottile/blacken-docs
    rev: 1.20.0
    hooks:
      - id: blacken-docs
        additional_dependencies: [black==24.2.0]
  - repo: https://github.com/DanielNoord/pydocstringformatter
    rev: v1.0.0
    hooks:
      - id: pydocstringformatter
        args: ["--max-summary-lines=2", "--linewrap-full-docstring"]
  - repo: https://github.com/Pierre-Sassoulas/black-disable-checker/
    rev: v1.1.3
    hooks:
      - id: black-disable-checker
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.9.9
    hooks:
      - id: prettier
        args: [--prose-wrap=always, --print-width=88]
        exclude: "survey/static/|dev/templates/|survey/templates/|survey/locale/|survey/tests/"
  - repo: local
    hooks:
      - id: import-linter
        name: import-linter (no circular imports)
        # Contracts live in .importlinter. Declared local with language: python
        # so the hook env needs nothing from the project: grimp reads the source
        # statically. Version is pinned here, not by a rev, so `pre-commit
        # autoupdate` won't move it: bump it by hand.
        entry: lint-imports
        language: python
        additional_dependencies: ["import-linter==2.15"]
        pass_filenames: false
        require_serial: true
        types: [python]
      - id: pylint
        name: pylint
        entry: pylint
        language: system
        types: [python]
        args:
          [
            "-rn",
            "-sn",
            "--rcfile=pyproject.toml",
            "--django-settings-module=settings",
            "--load-plugins=pylint_django",
            "--fail-on=I",
          ]
        # doc/conf.py uses the lowercase names required by Sphinx
        exclude: "survey/migrations/|doc/conf.py"
