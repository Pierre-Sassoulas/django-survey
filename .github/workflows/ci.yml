name: CI

on:
  push:
    branches:
      - main
  pull_request: ~

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        # LTS releases plus the latest release
        django-version: ["2.2", "3.2", "4.2", "5.2", "6.1"]
        exclude:
          # Django < 4.2 imports cgi, removed in python 3.13
          - { django-version: "2.2", python-version: "3.13" }
          - { django-version: "2.2", python-version: "3.14" }
          - { django-version: "2.2", python-version: "3.15" }
          - { django-version: "3.2", python-version: "3.13" }
          - { django-version: "3.2", python-version: "3.14" }
          - { django-version: "3.2", python-version: "3.15" }
          # Django 4.2 is broken on python 3.14+
          - { django-version: "4.2", python-version: "3.14" }
          - { django-version: "4.2", python-version: "3.15" }
          # Django 6 requires python 3.12+
          - { django-version: "6.1", python-version: "3.10" }
          - { django-version: "6.1", python-version: "3.11" }
    steps:
      - uses: actions/checkout@v7
      - name: Python ${{ matrix.python-version }} django ${{ matrix.django-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -yqq texlive-latex-base gettext texlive-pictures texlive-latex-extra
          sudo apt-get install -yqq texlive-xetex libblas-dev liblapack-dev libatlas-base-dev gfortran
          # Install in one go so dev dependencies cannot upgrade django
          pip3 install -e ".[dev]" "django~=${{ matrix.django-version }}.0"
      - name: Test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 manage.py test
          coverage run --source=survey --omit=survey/migrations/* ./manage.py test
          coverage html
          coveralls debug --service=github
      - name: pylint
        run: |
          pre-commit run pylint --all-files
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Build documentation
        run: |
          pip3 install ".[docs]"
          sphinx-build --fail-on-warning --nitpicky doc doc/_build/html
